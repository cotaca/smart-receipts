name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smart_receipts
          POSTGRES_PASSWORD: smart_receipts
          POSTGRES_DB: smart_receipts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_receipts -d smart_receipts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://smart_receipts:smart_receipts@localhost:5432/smart_receipts_test
      TEST_DATABASE_URL: postgresql+psycopg://smart_receipts:smart_receipts@localhost:5432/smart_receipts_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

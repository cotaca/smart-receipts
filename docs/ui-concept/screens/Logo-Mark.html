    <path fill="var(--card)" stroke="var(--border)" stroke-width="1" d="M8 8L12 4L16 8L20 4L24 8L28 4L32 8L36 4L40 8L44 4L48 8L52 4L56 8L60 4L64 8L68 4L72 8L76 4L80 8L84 4L88 8V120L84 124L80 120L76 124L72 120L68 124L64 120L60 124L56 120L52 124L48 120L44 124L40 120L36 124L32 120L28 124L24 120L20 124L16 120L12 124L8 120Z"></path>

    <g font-family="Geist Mono, ui-monospace, monospace" font-size="4.6" fill="{{ c.ink }}">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;dir&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;A&quot;,&quot;B&quot;,&quot;C&quot;],&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;v&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;s16&quot;,&quot;m24&quot;,&quot;detail&quot;,&quot;landing&quot;],&quot;default&quot;:&quot;m24&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;mono&quot;,&quot;inverse&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:96,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dir = this.props.dir ?? "A";
    const v = this.props.v ?? "m24";
    const tone = this.props.tone ?? "full";
    const size = Number(this.props.size ?? 96);
    const inverse = tone === "inverse";
    const S5 = [".###.", "#...#", "#....", ".###.", "....#", "#...#", ".###."];
    const R5 = ["####.", "#...#", "#...#", "####.", "#.#..", "#..#.", "#...#"];
    const S3 = ["###", "#..", "###", "..#", "###"];
    const R3 = ["##.", "#.#", "##.", "#.#", "#.#"];
    const dots = (ox, oy, pitch, r) => {
      let d = "";
      [S5, R5].forEach((g, gi) => g.forEach((row, y) => [...row].forEach((ch, x) => {
        if (ch !== "#") return;
        const cx = ox + (x + gi * 6) * pitch, cy = oy + y * pitch;
        d += `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;
      })));
      return d;
    };
    let pix = "";
    [S3, R3].forEach((g, gi) => g.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch !== "#") return;
      const px = 1 + (x + gi * 4) * 2, py = 2 + y * 2;
      pix += `M${px} ${py}H${px + 2}V${py + 2}H${px}Z`;
    })));
    const mono = "currentColor", inv = "var(--primary-foreground)";
    const c = tone === "full"
      ? { main: "var(--primary)", roll: "var(--accent)", hi: "var(--secondary)", rule: "var(--accent)", ink: "var(--foreground)" }
      : tone === "mono"
        ? { main: mono, roll: mono, hi: mono, rule: mono, ink: mono }
        : { main: inv, roll: inv, hi: inv, rule: inv, ink: inv };
    const base = v === "s16" ? 16 : v === "m24" ? 24 : 96;
    const pad = inverse ? base / 6 : 0;
    const detail = v === "detail" || v === "landing";
    const vbH = detail ? 128 : base;
    return {
      w: size,
      h: detail ? Math.round((size * 128) / 96) : size,
      vb: `${-pad} ${-pad} ${base + 2 * pad} ${vbH + 2 * pad}`,
      sr: v === "s16" ? "crispEdges" : "geometricPrecision",
      inverse,
      full: tone === "full",
      tile: { x: -pad, y: -pad, s: base + 2 * pad },
      c,
      aM: dir === "A" && v === "m24", aS: dir === "A" && v === "s16", aD: dir === "A" && v === "detail",
      bM: dir === "B" && v === "m24", bS: dir === "B" && v === "s16", bD: dir === "B" && v === "detail",
      lD: v === "landing",
      cM: dir === "C" && v === "m24", cS: dir === "C" && v === "s16", cD: dir === "C" && v === "detail",
      dotsM: dots(2, 6, 2, 0.8),
      dotsD: dots(28, 14, 4, 1.6),
      pixS: pix,
    };
  }
}
</script>

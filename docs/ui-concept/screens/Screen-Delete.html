<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;display:flex;align-items:center;justify-content:center;min-height:100%;box-sizing:border-box;background:var(--background);font-family:Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased">
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(2px)"></div>
  <div style="position:relative;display:flex;width:100%;max-width:384px;flex-direction:column;gap:16px;border-radius:0.875rem;background:var(--popover);padding:16px;box-shadow:0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent);font-size:12px;line-height:1.625;color:var(--popover-foreground)">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-size:14px;font-weight:500;letter-spacing:-0.01em">Delete receipt?</div>
      <div style="color:var(--muted-foreground)">This will permanently delete the receipt from REWE Markt Süd. This can't be undone.</div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;border-radius:0.625rem;border:1px solid var(--border);background:var(--card);padding:8px 10px">
      <div style="width:36px;height:36px;flex:none;border-radius:0.5rem;background:var(--muted);box-shadow:0 0 0 1px var(--border)"></div>
      <div style="display:flex;flex:1;min-width:0;flex-direction:column;gap:1px">
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500">REWE Markt Süd</div>
        <div style="font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:var(--muted-foreground)">2026-09-14 · 42,18 EUR</div>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:8px">
      <div style="display:flex;height:28px;align-items:center;border-radius:0.5rem;border:1px solid var(--border);padding:0 10px;font-weight:500">Cancel</div>
      <div style="display:flex;height:28px;align-items:center;gap:5px;border-radius:0.5rem;background:color-mix(in oklch, var(--destructive) 12%, transparent);padding:0 10px;font-weight:500;color:var(--destructive)">
        <sc-if value="{{ isDeleting }}" hint-placeholder-val="{{ false }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="animation:dcspin 1s linear infinite"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"></path></svg>
        </sc-if>
        <span>{{ label }}</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:320},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;deleting&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const deleting = (this.props.state ?? "idle") === "deleting";
    return { isDeleting: deleting, label: deleting ? "Deleting…" : "Delete" };
  }
}
</script>
</body>
</html>

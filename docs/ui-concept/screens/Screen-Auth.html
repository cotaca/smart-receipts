<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--muted);padding:24px;min-height:100%;box-sizing:border-box;font-family:Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="display:flex;width:36px;height:36px;align-items:center;justify-content:center;border-radius:0.625rem;background:var(--primary);color:var(--primary-foreground)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v17l-2.5-1.5L15 21l-3-1.5L9 21l-2.5-1.5L4 21Z"></path><path d="M8 8h8M8 12h8M8 16h4"></path></svg>
    </div>
    <div style="font-size:14px;font-weight:600;letter-spacing:-0.01em;color:var(--foreground)">SmartReceipts</div>
  </div>

  <div style="display:flex;width:100%;max-width:384px;flex-direction:column;gap:16px;border-radius:0.625rem;background:var(--card);padding:16px;box-shadow:0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent);font-size:12px;line-height:1.625;color:var(--card-foreground)">
    <div style="display:flex;height:32px;align-items:center;border-radius:0.625rem;background:var(--muted);padding:3px;gap:0">
      <div style="display:flex;flex:1;height:100%;align-items:center;justify-content:center;border-radius:0.5rem;font-size:12px;font-weight:500;background:var(--background);color:var(--foreground)" data-tab="login">Log in</div>
      <div style="display:flex;flex:1;height:100%;align-items:center;justify-content:center;border-radius:0.5rem;font-size:12px;font-weight:500;color:color-mix(in oklch, var(--foreground) 60%, transparent)" data-tab="register">Create account</div>
    </div>

    <sc-if value="{{ isSuccess }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 4px 8px">
        <div style="display:flex;width:36px;height:36px;align-items:center;justify-content:center;border-radius:9999px;background:color-mix(in oklch, var(--foreground) 8%, transparent);color:var(--foreground)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg>
        </div>
        <div style="font-size:12px;font-weight:600;color:var(--foreground)">Signed in</div>
        <div style="text-align:center;font-size:12px;color:var(--muted-foreground)">Redirecting you to your receipts…</div>
      </div>
    </sc-if>

    <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:14px">
        <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
          <div role="alert" style="display:grid;grid-template-columns:auto 1fr;gap:2px 6px;width:100%;border-radius:0.625rem;border:1px solid var(--border);background:var(--card);padding:6px 8px;font-size:12px;line-height:1.625;color:var(--destructive)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="grid-row:span 2;transform:translateY(2px)"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4.5M12 16h.01"></path></svg>
            <div style="grid-column:2">Invalid email or password</div>
          </div>
        </sc-if>

        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="font-size:12px;font-weight:500;color:var(--foreground)">Email</label>
          <div style="display:flex;height:28px;align-items:center;border-radius:0.5rem;border:1px solid var(--input);background:color-mix(in oklch, var(--input) 20%, transparent)">
            <div style="display:flex;align-items:center;padding-left:8px;color:var(--muted-foreground)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
            </div>
            <div style="flex:1;padding:0 8px;font-size:12px;color:var(--muted-foreground)">you@example.com</div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="font-size:12px;font-weight:500;color:var(--foreground)">Password</label>
          <div style="display:flex;height:28px;align-items:center;border-radius:0.5rem;border:1px solid var(--input);background:color-mix(in oklch, var(--input) 20%, transparent)">
            <div style="display:flex;align-items:center;padding-left:8px;color:var(--muted-foreground)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></svg>
            </div>
            <div style="flex:1;padding:0 8px;font-size:12px;letter-spacing:0.08em;color:var(--foreground)">••••••••</div>
            <div style="display:flex;align-items:center;padding-right:8px;color:var(--muted-foreground)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
            </div>
          </div>
        </div>

        <div style="display:flex;height:28px;width:100%;align-items:center;justify-content:center;gap:6px;border-radius:0.5rem;background:var(--primary);color:var(--primary-foreground);font-size:12px;font-weight:500">
          <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="animation:dcspin 1s linear infinite"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"></path></svg>
          </sc-if>
          <span>{{ submitLabel }}</span>
        </div>

        <div style="text-align:center;font-size:12px;color:var(--muted-foreground)">Don't have an account? <span style="color:var(--foreground);font-weight:500">Sign up</span></div>
      </div>
    </sc-if>
  </div>

  <div style="display:flex;height:24px;align-items:center;padding:0 8px;border-radius:0.5rem;font-size:12px;font-weight:500;color:var(--foreground)">{{ themeLabel }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:520},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;error&quot;,&quot;loading&quot;,&quot;success&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;themeLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Switch to dark&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? "default";
    return {
      isSuccess: state === "success",
      isForm: state !== "success",
      showError: state === "error",
      isLoading: state === "loading",
      submitLabel: state === "loading" ? "Signing in…" : "Log in",
      themeLabel: this.props.themeLabel ?? "Switch to dark",
    };
  }
}
</script>
</body>
</html>
